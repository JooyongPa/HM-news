<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/visit/">  <!-- /visit(끝 / 없음)으로 열려도 그림 경로가 맞게 -->
<title>H.M Studio — 방문객 라운지</title>
<meta name="description" content="주용파의 오늘도 수고했어를 만드는 Healing Mind Studio의 AI 크루 사무실">
<style>
:root{--paper:#f5f1e6;--ink:#2a251e;--soft:#6b6256;--line:#d9cfbd;--teal:#26687f;--good:#1d9e75;--card:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.18em;font-size:15px;color:var(--teal)}
.brand small{display:block;letter-spacing:.02em;font-weight:600;color:var(--soft);font-size:12px;margin-top:2px}
.now{margin-left:auto;font-size:13px;color:var(--soft)}.now b{color:var(--ink);font-variant-numeric:tabular-nums}
header a{font-size:13px;font-weight:700;color:#fff;background:var(--teal);padding:6px 12px;border-radius:999px;text-decoration:none}
main{max-width:1400px;margin:0 auto;padding:16px 20px 28px}
.lede{margin:0 0 12px;font-size:14px;color:var(--soft);line-height:1.6}
.stage{position:relative;width:100%;aspect-ratio:1652/897;container-type:size;background:#f4f3ef;border:1px solid var(--line);border-radius:14px;overflow:hidden;--ch:11cqh}
.fl{position:absolute;inset:0;background-size:100% 100%;pointer-events:none;transition:filter 1.5s}.fl.base{z-index:0}.fl.occ{z-index:3}
.stage.night .fl{filter:brightness(.87) saturate(.85)}
.who{position:absolute;transform:translate(-50%,-100%);z-index:4;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.who.behind{z-index:2}
.who img{height:var(--ch);width:auto;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22));animation:bob 2.6s ease-in-out infinite}
.who:nth-child(odd) img{animation-delay:-1.3s}
.who .tag{margin-top:2px;background:rgba(255,253,247,.95);border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:clamp(9px,1.1cqh,12px);font-weight:700;white-space:nowrap}
.who.behind .tag{position:absolute;bottom:calc(100% + 2px);margin:0}
.who.sel .tag{background:var(--teal);color:#fff;border-color:var(--teal)}
.zzz{position:absolute;transform:translate(-50%,-100%);z-index:4;font-size:clamp(9px,1.1cqh,12px);font-weight:700;color:var(--soft);background:rgba(255,253,247,.8);border:1px dashed var(--line);border-radius:8px;padding:1px 6px;white-space:nowrap;cursor:pointer}
@keyframes bob{50%{transform:translateY(-1.5px)}}
.card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:14px;align-items:center;min-height:96px}
.card img{height:76px;width:auto}.card b{font-size:17px}.card .r{font-size:12.5px;color:var(--soft);margin-top:2px}.card .d{font-size:13.5px;margin-top:6px}
.card .st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;background:rgba(0,0,0,.06);color:var(--soft);vertical-align:2px}
.card .st.on{background:rgba(29,158,117,.14);color:var(--good)}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:16px}
.crew button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fffaf0}
.crew button img{height:60px;width:auto}.crew b{display:block;font-size:13px;margin-top:4px}.crew span{font-size:11.5px;color:var(--soft)}
footer{max-width:1400px;margin:0 auto;padding:0 20px 24px;font-size:12px;color:var(--soft)}
footer a{color:var(--soft)}
@media (max-width:700px){header{padding:12px 16px}main{padding:12px 16px 24px}.now{margin-left:0;width:100%}.who .tag{display:none}.who.sel .tag{display:block}.zzz{font-size:0;padding:0 2px;border:0;background:none}.zzz::first-letter{font-size:10px}}  /* 폰: 그림이 작아 이름표는 누른 크루만 */
</style>
</head>
<body>
<header>
  <div class="brand">HEALING MIND STUDIO<small>H.M 스튜디오 · 방문객 라운지</small></div>
  <div class="now">한국 시각 <b id="clock">--:--</b> · <span id="cnt"></span></div>
  <a href="/">오늘 신문 보기 →</a>
</header>
<main>
  <p class="lede">「주용파의 오늘도 수고했어」를 만드는 AI 크루들의 사무실입니다. 크루들은 실제 근무 시간(한국 시각)에 맞춰 출근하고 퇴근해요. 캐릭터를 누르면 누가 무슨 일을 하는지 볼 수 있습니다.</p>
  <div class="stage" id="stage"></div>
  <div class="card" id="card"><div style="color:var(--soft);font-size:14px">캐릭터를 누르면 크루를 소개해 드려요.</div></div>
  <div class="crew" id="crew"></div>
</main>
<footer>※ 본 콘텐츠는 AI를 활용하여 작성되었습니다. · Healing Mind Studio · <a href="old.html">예전 방문객 라운지</a></footer>
<script>
const D = {"crop": [0.6, 4.2, 99.4, 99.6], "seats": {"jooyongpa": [86.2, 64.3], "hedi": [28.2, 56.6], "kkoki": [75.3, 51.5], "turtle": [72.8, 87.6], "bucky": [53, 73.5], "keul": [54.6, 36.9], "rabbit": [27.6, 26.3], "gompapa": [63, 81.5], "codex": [39.3, 28.8], "agy": [44.4, 30.6], "junior_1": [9.6, 41.8], "junior_2": [16.3, 44.6], "junior_3": [19.3, 41.2]}, "behind": ["rabbit", "jooyongpa", "codex", "agy", "keul"], "occ": [[[24.0, 19.3], [24.9, 16.8], [25.3, 18.3], [26.1, 21.1], [27.6, 22.2], [29.0, 23.2], [29.4, 23.9], [29.4, 28.7], [28.5, 30.0], [27.0, 29.2], [25.3, 28.0], [24.2, 26.4], [24.0, 24.6]], [[81.6, 59.0], [84.2, 58.0], [85.0, 58.3], [85.0, 60.9], [87.6, 60.9], [87.6, 58.5], [89.7, 60.9], [90.2, 63.1], [90.0, 66.9], [88.9, 68.2], [86.6, 68.4], [84.2, 67.3], [82.4, 65.6], [81.7, 63.9], [81.5, 60.5]], [[38.3, 27.2], [39.0, 25.9], [45.2, 29.1], [45.8, 29.9], [44.3, 31.2], [38.9, 30.1]], [[51.4, 33.9], [60.0, 36.1], [59.9, 36.6], [58.4, 40.4], [51.8, 37.3]]], "staff": [{"ids": ["jooyongpa"], "name": "주용파님", "role": "논설 · 앵커", "desc": "매일 사설 주용파의 한마디 · 1분 브리핑"}, {"ids": ["gompapa"], "name": "곰파파님", "role": "고문 · 주말 편지", "desc": "토요일 이번 주도 수고했어 · 곰파파의 한마디"}, {"ids": ["keul"], "name": "클님", "role": "총괄 관제", "desc": "스튜디오 전체 살피기"}, {"ids": ["turtle"], "name": "터틀님", "role": "편집 담당", "desc": "새벽 기사 고르기 · 원문 대조 교열"}, {"ids": ["kkoki"], "name": "꼬끼님", "role": "발행 알림", "desc": "신문 나가면 종 울리기"}, {"ids": ["hedi"], "name": "헤디님", "role": "메일 매니저", "desc": "독자 메일 살피기"}, {"ids": ["rabbit"], "name": "바니님", "role": "비서실장", "desc": "아침 보고서 · 결재함"}, {"ids": ["bucky"], "name": "버키님", "role": "자동화 정비", "desc": "매일 자동화 점검"}, {"ids": ["codex"], "name": "지피님", "role": "GPT 크루", "desc": "교차검증 · 이미지"}, {"ids": ["agy"], "name": "제미·니니님", "role": "Gemini 크루", "desc": "교차검증 · 이미지 · 구글 드라이브 관리"}, {"ids": ["junior_1", "junior_2", "junior_3"], "name": "햄쥐1·2·3님", "role": "신입 크루", "desc": "어느 부서든 출동하는 보조"}], "shifts": {"jooyongpa": {"start": 6.0, "end": 16.0, "days": [1, 2, 3, 4, 5, 6], "sat": [6.0, 13.0]}, "hedi": {"start": 9.0, "end": 17.0, "days": [1, 2, 3, 4, 5, 6]}, "gompapa": {"start": 9.0, "end": 17.0, "days": [1, 2, 3, 4, 5, 6]}, "bucky": {"start": 9.0, "end": 17.0, "days": [1, 2, 3, 4, 5, 6]}, "kkoki": {"start": 6.0, "end": 14.0, "days": [1, 2, 3, 4, 5, 6]}, "rabbit": {"start": 8.5, "end": 17.5, "days": [1, 2, 3, 4, 5, 6]}, "turtle": {"start": 5.5, "end": 12.5, "days": [1, 2, 3, 4, 5, 6]}, "junior_1": {"start": 9.0, "end": 18.0, "days": [1, 2, 3, 4, 5, 6]}, "junior_2": {"start": 9.0, "end": 18.0, "days": [1, 2, 3, 4, 5, 6]}, "junior_3": {"start": 9.0, "end": 18.0, "days": [1, 2, 3, 4, 5, 6]}}};
const stage = document.getElementById('stage');
const C = D.crop, P = ([x,y]) => [(x-C[0])/(C[2]-C[0])*100, (y-C[1])/(C[3]-C[1])*100];
stage.style.setProperty('--ch', (10.5*100/(C[3]-C[1])).toFixed(2)+'cqh');
const FLOOR='assets/floor.jpg';
const base=document.createElement('div'); base.className='fl base'; base.style.backgroundImage=`url(${FLOOR})`; stage.appendChild(base);
D.occ.forEach(poly=>{const o=document.createElement('div'); o.className='fl occ'; o.style.backgroundImage=`url(${FLOOR})`;
  o.style.clipPath='polygon('+poly.map(pt=>P(pt).map(v=>v.toFixed(2)+'%').join(' ')).join(',')+')'; stage.appendChild(o);});
const BEHIND = new Set(D.behind);
const PEOPLE = [];
D.staff.forEach(s => s.ids.forEach((id,i) => PEOPLE.push({id, staff:s, name: s.ids.length>1 ? `햄쥐${i+1}` : s.name.replace(/님$/,'')+'님'})));
function kst(){ const n=new Date(); return new Date(n.getTime() + (n.getTimezoneOffset()+540)*60000); }
function onDuty(id, t){
  const sh = D.shifts[id]; if(!sh) return true;            // 명부 밖(클님·지피·제미니) = 24시간
  const dow = t.getDay(); if(!sh.days.includes(dow)) return false;
  const h = t.getHours() + t.getMinutes()/60;
  const [a,b] = (dow===6 && sh.sat) ? sh.sat : [sh.start, sh.end];
  return a <= h && h < b;
}
let sel = null;
function show(p){
  sel = p.id; const t = kst(), on = onDuty(p.id, t);
  document.getElementById('card').innerHTML = `<img src="assets/${p.id}.png" alt=""><div><b>${p.name}</b><span class="st ${on?'on':''}">${on?'근무 중':'퇴근'}</span>
    <div class="r">${p.staff.role}</div><div class="d">${p.staff.desc}</div></div>`;
  draw();
}
function draw(){
  const t = kst(); let n = 0;
  document.getElementById('clock').textContent = t.toTimeString().slice(0,5);
  stage.classList.toggle('night', t.getHours()>=19 || t.getHours()<6);
  stage.querySelectorAll('.who,.zzz').forEach(e=>e.remove());
  PEOPLE.forEach(p => {
    const seat = D.seats[p.id]; if(!seat) return;
    const [x,y] = P(seat), on = onDuty(p.id, t);
    const el = document.createElement('div');
    if(on){ n++;
      el.className = 'who' + (BEHIND.has(p.id)?' behind':'') + (sel===p.id?' sel':'');
      el.innerHTML = `<img src="assets/${p.id}.png" alt="${p.name}"><div class="tag">${p.name}</div>`;
    } else { el.className = 'zzz'; el.textContent = '💤 ' + p.name; }
    el.style.left = x+'%'; el.style.top = y+'%'; el.onclick = () => show(p);
    stage.appendChild(el);
  });
  document.getElementById('cnt').textContent = `지금 ${n}명 근무 중`;
}
document.getElementById('crew').innerHTML = D.staff.map((s,i)=>`<button data-i="${i}"><div style="white-space:nowrap">${s.ids.map(id=>`<img src="assets/${id}.png" alt="" style="${s.ids.length>1?'height:44px;margin:8px -4px 8px':''}">`).join('')}</div><b>${s.name}</b><span>${s.role}</span></button>`).join('');
document.querySelectorAll('#crew button').forEach(b=>b.onclick=()=>{ const s=D.staff[b.dataset.i]; show(PEOPLE.find(p=>p.staff===s)); window.scrollTo({top:0,behavior:'smooth'}); });
draw(); setInterval(draw, 60000);
</script>
</body>
</html>
